<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wio Terminal AI Quota Dashboard Preview</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      min-width: 0;
    }

    :root {
      color-scheme: dark;
      interpolate-size: allow-keywords;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      --bg: oklch(0.13 0.02 240);
      --text: oklch(0.93 0.02 230);
      --muted: oklch(0.72 0.035 220);
      --track: oklch(0.2 0.03 235);
      --track-edge: oklch(0.32 0.045 235);
      --rule: oklch(0.34 0.045 235);
      --footer-bg: oklch(0.08 0.02 235);
      --panel: oklch(0.16 0.03 240);
      --panel-border: oklch(0.35 0.04 230);
      /* Default accent matches the Overview page; the screen swaps it per page. */
      --accent: oklch(0.68 0.19 45);
      --accent-soft: color-mix(in oklch, var(--accent) 55%, oklch(0.93 0.02 230));
      --accent-glow: color-mix(in oklch, var(--accent) 55%, transparent);
    }

    body {
      margin: 0;
      min-block-size: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-synthesis: none;
      text-wrap: pretty;
      overflow-wrap: break-word;
      background:
        radial-gradient(circle at 50% 0%, oklch(0.3 0.06 230 / 0.24), transparent 34%),
        var(--bg);
    }

    .stage {
      display: grid;
      gap: 14px;
      justify-items: center;
      inline-size: 320px;
    }

    /* Pixel-accurate mirror of the Wio's 320x240 screen; absolute coordinates
       below are screen coordinates, not responsive layout, so they stay in px. */
    .screen {
      position: relative;
      inline-size: 320px;
      block-size: 240px;
      overflow: clip;
      contain: layout paint;
      background:
        linear-gradient(180deg, oklch(0.16 0.03 235 / 0.55) 0%, transparent 58%),
        oklch(0.05 0.015 235);
      box-shadow: 0 18px 60px oklch(0 0 0 / 0.5);
      color: var(--text);
    }

    .page-title {
      position: absolute;
      inset-block-start: 8px;
      inset-inline-start: 16px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      line-height: 16px;
      text-wrap: balance;
    }

    .page-indicator {
      position: absolute;
      inset-block-start: 8px;
      inset-inline-end: 16px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 16px;
      font-variant-numeric: tabular-nums;
    }

    .title-rule {
      position: absolute;
      inset-block-start: 34px;
      inset-inline-start: 16px;
      inset-inline-end: 16px;
      block-size: 1px;
      background: var(--rule);
    }

    .big-value {
      position: absolute;
      inset-block-start: 52px;
      inset-inline-start: 16px;
      color: var(--accent);
      font-size: 30px;
      line-height: 26px;
      font-weight: 800;
      text-shadow: 0 0 10px var(--accent-glow);
      text-wrap: balance;
    }

    .big-label {
      position: absolute;
      inset-block-start: 92px;
      inset-inline-start: 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 16px;
    }

    .big-bar {
      position: absolute;
      inset-block-start: 116px;
      inset-inline-start: 16px;
      inline-size: 130px;
      block-size: 10px;
      border-radius: 999px;
      background: var(--track);
      border: 1px solid var(--track-edge);
      overflow: clip;
    }

    .big-bar .fill {
      inline-size: var(--pct, 0%);
      block-size: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      box-shadow: 0 5px 9px var(--accent-glow);
    }

    .h-divider {
      position: absolute;
      inset-block-start: 46px;
      inset-inline-start: 164px;
      inline-size: 1px;
      block-size: 140px;
      background: var(--rule);
    }

    .hint {
      position: absolute;
      inset-block-start: 176px;
      inset-inline-start: 16px;
      color: oklch(0.5 0.04 220);
      font-size: 12px;
      font-weight: 700;
    }

    .r {
      position: absolute;
      inset-inline-start: 178px;
      inset-inline-end: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      line-height: 16px;
      white-space: nowrap;
    }

    .r:nth-child(1) { inset-block-start: 48px; }
    .r:nth-child(2) { inset-block-start: 82px; }
    .r:nth-child(3) { inset-block-start: 116px; }
    .r:nth-child(4) { inset-block-start: 150px; }

    .r-label {
      color: var(--muted);
      font-weight: 700;
      overflow: clip;
      text-overflow: ellipsis;
    }

    .r-value {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      position: absolute;
      inset-inline: 0;
      inset-block-end: 0;
      block-size: 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      border-block-start: 1px solid var(--rule);
      background: linear-gradient(180deg, oklch(0.12 0.02 235 / 0.1), var(--footer-bg));
      font-size: 11px;
      font-weight: 700;
    }

    .footer > span {
      text-align: center;
      overflow: clip;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding-inline: 4px;
    }

    .footer > span + span {
      border-inline-start: 1px solid var(--rule);
    }

    .controls {
      inline-size: 320px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: oklch(0.68 0.04 220);
      font-size: 12px;
    }

    .controls button {
      block-size: 28px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      padding-inline: 10px;
      cursor: pointer;
      user-select: none;
    }

    .controls button.is-active {
      border-color: var(--accent);
      color: var(--accent-soft);
    }

    .controls button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
    }

    .controls button:focus-visible {
      outline: max(2px, 0.08em) solid currentColor;
      outline-offset: 2px;
    }

    @media (hover: hover) and (pointer: fine) {
      .controls button:hover:not(:disabled) {
        border-color: var(--accent);
      }
    }

    .status {
      flex: 1 1 100%;
      min-width: 0;
      block-size: 16px;
      overflow: clip;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-nav {
      justify-content: center;
    }

    .debug-panel {
      inline-size: 320px;
      block-size: 148px;
      overflow: auto;
      scrollbar-gutter: stable;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: oklch(0.08 0.015 235 / 0.72);
      color: oklch(0.78 0.03 220);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      contain: layout paint;
    }
  </style>
</head>
<body>
  <div class="stage">
  <main class="screen" aria-label="Wio Terminal 320 by 240 dashboard preview">
    <header class="page-title" data-title>Overview</header>
    <span class="page-indicator" data-indicator>1/4</span>
    <div class="title-rule"></div>
    <div class="big-value" data-big>--</div>
    <div class="big-label" data-big-label>--</div>
    <div class="big-bar" data-big-bar hidden><div class="fill"></div></div>
    <div class="h-divider"></div>
    <section class="rows" aria-label="page metrics">
      <div class="r"><span class="r-label">--</span><span class="r-value">--</span></div>
      <div class="r"><span class="r-label">--</span><span class="r-value">--</span></div>
      <div class="r"><span class="r-label">--</span><span class="r-value">--</span></div>
      <div class="r"><span class="r-label">--</span><span class="r-value">--</span></div>
    </section>
    <div class="hint">&lt; &gt; switch page</div>
    <footer class="footer"><span data-footer-brand>Magpie</span><span data-footer-tokens>--</span><span data-footer-time>--:--</span></footer>
  </main>
  <div class="controls">
    <button type="button" data-action="connect">Connect Wio</button>
    <button type="button" data-action="scan-any">Scan Any</button>
    <button type="button" data-action="diag">Diag</button>
    <button type="button" data-action="sync" disabled>Sync</button>
    <span class="status" data-status>waiting for server</span>
  </div>
  <div class="controls page-nav">
    <button type="button" data-action="page-prev" aria-label="previous page">&#9664;</button>
    <button type="button" data-page="0">Overview</button>
    <button type="button" data-page="1">Requests</button>
    <button type="button" data-page="2">Sessions</button>
    <button type="button" data-page="3">Context</button>
    <button type="button" data-action="page-next" aria-label="next page">&#9654;</button>
  </div>
  <pre class="debug-panel" data-debug-log>debug log ready</pre>
  </div>

  <script>
    const API_URL = "/api/quota";
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    const PAGE_TITLES = ["Overview", "Requests", "Sessions", "Context"];
    const PAGE_ACCENTS = [
      { accent: "oklch(0.68 0.19 45)" },
      { accent: "oklch(0.72 0.15 220)" },
      { accent: "oklch(0.72 0.16 160)" },
      { accent: "oklch(0.62 0.17 315)" },
    ];

    const state = { quota: null, quotaHash: "", pageIndex: 0, characteristic: null, txCharacteristic: null, connected: false, device: null };

    const screenEl = document.querySelector(".screen");
    const titleEl = document.querySelector("[data-title]");
    const indicatorEl = document.querySelector("[data-indicator]");
    const bigEl = document.querySelector("[data-big]");
    const bigLabelEl = document.querySelector("[data-big-label]");
    const barEl = document.querySelector("[data-big-bar]");
    const fillEl = barEl.querySelector(".fill");
    const rowEls = Array.from(document.querySelectorAll(".r"));
    const footerBrandEl = document.querySelector("[data-footer-brand]");
    const footerTokensEl = document.querySelector("[data-footer-tokens]");
    const footerTimeEl = document.querySelector("[data-footer-time]");
    const pageButtons = Array.from(document.querySelectorAll('[data-page]'));

    const statusEl = document.querySelector("[data-status]");
    const debugEl = document.querySelector("[data-debug-log]");
    const connectButton = document.querySelector('[data-action="connect"]');
    const scanAnyButton = document.querySelector('[data-action="scan-any"]');
    const diagButton = document.querySelector('[data-action="diag"]');
    const syncButton = document.querySelector('[data-action="sync"]');
    const prevButton = document.querySelector('[data-action="page-prev"]');
    const nextButton = document.querySelector('[data-action="page-next"]');

    function logDebug(message, detail) {
      const time = new Date().toLocaleTimeString();
      const suffix = detail === undefined ? "" : ` ${typeof detail === "string" ? detail : JSON.stringify(detail)}`;
      const line = `[${time}] ${message}${suffix}`;
      debugEl.textContent = `${line}\n${debugEl.textContent}`.slice(0, 6000);
      console.log(line);
    }

    function clampPercent(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 0;
      return Math.max(0, Math.min(100, Math.round(number)));
    }

    function rowLabelValue(row) {
      // Raw quota stores rows as [label, value] pairs; the compact device form
      // uses {n, v}. Accept both.
      if (Array.isArray(row)) return { n: String(row[0] ?? ""), v: String(row[1] ?? "") };
      return { n: String(row.n ?? ""), v: String(row.v ?? "") };
    }

    function normalizePage(page, index) {
      page = page || {};
      const rows = (Array.isArray(page.r) ? page.r : []).slice(0, 4);
      const normalizedRows = [];
      for (let i = 0; i < 4; i++) normalizedRows.push(rowLabelValue(rows[i]));
      const bar = Number(page.b);
      return {
        t: String(page.t ?? PAGE_TITLES[index]).slice(0, 15),
        v: String(page.v ?? "--"),
        l: String(page.l ?? "--").slice(0, 15),
        b: Number.isFinite(bar) && bar >= 0 ? clampPercent(bar) : -1,
        rows: normalizedRows,
      };
    }

    function normalizeQuota(raw) {
      const magpie = raw.magpie || {};
      const footer = magpie.footer || {};
      const rawPages = Array.isArray(magpie.pages) ? magpie.pages : [];
      return {
        updatedAt: String(raw.updatedAt || footer.time || ""),
        footer: {
          brand: String(footer.brand ?? "Magpie"),
          tokens: String(footer.tokens ?? "--"),
          time: String(footer.time ?? raw.updatedAt ?? "--:--"),
        },
        pages: [0, 1, 2, 3].map((i) => normalizePage(rawPages[i], i)),
      };
    }

    function compactForDevice(quota) {
      // Mirrors server.py compact_for_device so a direct Web Bluetooth "Sync"
      // pushes the same 4-page frame the firmware expects.
      return {
        u: quota.updatedAt,
        f: { c: quota.footer.brand, k: quota.footer.tokens, t: quota.footer.time },
        p: quota.pages.map((page) => ({
          t: page.t,
          v: page.v,
          l: page.l,
          b: page.b,
          r: page.rows.map((row) => ({ n: row.n, v: row.v })),
        })),
      };
    }

    function renderActivePage() {
      const fallback = { t: PAGE_TITLES[state.pageIndex], v: "--", l: "--", b: -1, rows: [{ n: "", v: "" }, { n: "", v: "" }, { n: "", v: "" }, { n: "", v: "" }] };
      const page = state.quota?.pages?.[state.pageIndex] || fallback;

      screenEl.style.setProperty("--accent", PAGE_ACCENTS[state.pageIndex].accent);
      titleEl.textContent = page.t;
      indicatorEl.textContent = `${state.pageIndex + 1}/4`;
      bigEl.textContent = page.v;
      bigLabelEl.textContent = page.l;

      barEl.hidden = page.b < 0;
      if (page.b >= 0) fillEl.style.setProperty("--pct", `${page.b}%`);

      rowEls.forEach((rowEl, i) => {
        const row = page.rows[i] || { n: "", v: "" };
        rowEl.children[0].textContent = row.n;
        rowEl.children[1].textContent = row.v;
      });

      if (state.quota) {
        footerBrandEl.textContent = state.quota.footer.brand;
        footerTokensEl.textContent = state.quota.footer.tokens;
        footerTimeEl.textContent = state.quota.footer.time;
      }

      pageButtons.forEach((button, i) => button.classList.toggle("is-active", i === state.pageIndex));
    }

    function setPage(index) {
      state.pageIndex = ((index % 4) + 4) % 4;
      renderActivePage();
    }

    async function loadQuota({ sync = false, quiet = false } = {}) {
      const response = await fetch(`${API_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`server ${response.status}`);
      const nextQuota = normalizeQuota(await response.json());
      const nextHash = JSON.stringify(nextQuota);
      const changed = nextHash !== state.quotaHash;
      state.quota = nextQuota;
      if (changed) {
        state.quotaHash = nextHash;
        renderActivePage();
        statusEl.textContent = `server updated ${state.quota.updatedAt || "now"}`;
        logDebug("server quota loaded", { updatedAt: state.quota.updatedAt });
      } else if (!quiet) {
        statusEl.textContent = `server unchanged ${state.quota.updatedAt || "now"}`;
      }
      if (sync && state.connected && changed) await sendQuota();
    }

    function logBluetoothDiagnostics() {
      logDebug("bluetooth diagnostics", {
        hasBluetooth: !!navigator.bluetooth,
        isSecureContext,
        protocol: location.protocol,
        host: location.host,
        userActivationActive: navigator.userActivation?.isActive ?? "unknown",
        userActivationSeen: navigator.userActivation?.hasBeenActive ?? "unknown",
        userAgent: navigator.userAgent
      });
    }

    async function connectWio({ acceptAll = false } = {}) {
      if (!navigator.bluetooth) {
        statusEl.textContent = "Web Bluetooth not available";
        logDebug("navigator.bluetooth unavailable");
        return;
      }

      statusEl.textContent = "select Wio Terminal";
      logBluetoothDiagnostics();
      logDebug("requestDevice start", { service: SERVICE_UUID, acceptAll });
      const requestOptions = acceptAll
        ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID] }
        : { filters: [{ namePrefix: "Wio AI Quota" }], optionalServices: [SERVICE_UUID] };
      const device = await navigator.bluetooth.requestDevice(requestOptions);
      state.device = device;
      logDebug("device selected", { name: device.name, id: device.id });
      device.addEventListener("gattserverdisconnected", () => {
        state.connected = false;
        state.characteristic = null;
        state.txCharacteristic = null;
        syncButton.disabled = true;
        statusEl.textContent = "bluetooth disconnected";
        logDebug("gatt disconnected");
      });

      logDebug("gatt connect start");
      const server = await device.gatt.connect();
      logDebug("gatt connected");
      logDebug("getPrimaryService start");
      const service = await server.getPrimaryService(SERVICE_UUID);
      logDebug("service found");
      state.characteristic = await service.getCharacteristic(RX_UUID);
      logDebug("rx characteristic found");
      try {
        state.txCharacteristic = await service.getCharacteristic(TX_UUID);
        await state.txCharacteristic.startNotifications();
        state.txCharacteristic.addEventListener("characteristicvaluechanged", (event) => {
          const text = new TextDecoder().decode(event.target.value.buffer).trim();
          logDebug("device notify", text);
        });
        logDebug("tx notify subscribed");
      } catch (error) {
        logDebug("tx notify unavailable", error.message);
      }
      state.connected = true;
      syncButton.disabled = false;
      statusEl.textContent = "bluetooth connected";
      if (state.quota) await sendQuota();
    }

    async function sendQuota() {
      if (!state.characteristic || !state.quota) return;
      const payload = `${JSON.stringify(compactForDevice(state.quota))}\n`;
      const bytes = new TextEncoder().encode(payload);
      logDebug("send start", { bytes: bytes.length, payload });
      for (let offset = 0; offset < bytes.length; offset += 120) {
        const chunk = bytes.slice(offset, offset + 120);
        try {
          logDebug("write chunk without response", { offset, bytes: chunk.length });
          await state.characteristic.writeValueWithoutResponse(chunk);
        } catch (error) {
          logDebug("write without response failed, retry with response", error.message);
          await state.characteristic.writeValue(chunk);
        }
      }
      statusEl.textContent = `synced ${state.quota.updatedAt || "now"}`;
      logDebug("send complete");
    }

    connectButton.addEventListener("click", () => {
      connectWio().catch((error) => {
        statusEl.textContent = error.message || "bluetooth failed";
        logDebug("connect failed", { name: error.name, message: error.message });
      });
    });

    scanAnyButton.addEventListener("click", () => {
      connectWio({ acceptAll: true }).catch((error) => {
        statusEl.textContent = error.message || "scan failed";
        logDebug("scan any failed", { name: error.name, message: error.message });
      });
    });

    diagButton.addEventListener("click", logBluetoothDiagnostics);

    syncButton.addEventListener("click", () => {
      sendQuota().catch((error) => {
        statusEl.textContent = error.message || "sync failed";
        logDebug("sync failed", { name: error.name, message: error.message });
      });
    });

    prevButton.addEventListener("click", () => setPage(state.pageIndex - 1));
    nextButton.addEventListener("click", () => setPage(state.pageIndex + 1));
    pageButtons.forEach((button) => {
      button.addEventListener("click", () => setPage(Number(button.dataset.page)));
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") { event.preventDefault(); setPage(state.pageIndex - 1); }
      else if (event.key === "ArrowRight") { event.preventDefault(); setPage(state.pageIndex + 1); }
      else if (event.key >= "1" && event.key <= "4") setPage(Number(event.key) - 1);
    });

    renderActivePage();
    loadQuota().catch((error) => {
      statusEl.textContent = error.message || "server failed";
      logDebug("server load failed", error.message);
    });
    setInterval(() => {
      loadQuota({ sync: true, quiet: true }).catch((error) => {
        statusEl.textContent = error.message || "server failed";
        logDebug("server interval failed", error.message);
      });
    }, 5000);
  </script>
</body>
</html>
